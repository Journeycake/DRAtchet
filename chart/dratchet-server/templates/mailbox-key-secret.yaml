{{- /*
docs/adr/0001: the mail store key, generated once and kept across upgrades
(looked up from the live Secret). It lives in the cluster's Secret store,
never on the fragment volumes. Not created when an existing Secret is named.
*/ -}}
{{- $mp := .Values.mailPersistence -}}
{{- if and $mp.enabled $mp.key.generate (not $mp.key.existingSecret) }}
{{- $name := include "dratchet-server.mailboxKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dratchet-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data $mp.key.secretKey) }}
  {{ $mp.key.secretKey }}: {{ index $existing.data $mp.key.secretKey }}
  {{- else }}
  {{ $mp.key.secretKey }}: {{ sha256sum (randAlphaNum 64) | b64enc }}
  {{- end }}
{{- end }}
