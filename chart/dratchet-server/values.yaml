# Default values for dratchet-server.

image:
  repository: dratchet-server
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# IMPORTANT — read before changing this: dratchetd holds all state (prekey
# directory, presence, mailboxes, live connections) in-memory only, per pod
# (docs/SERVERS.md §1.4 — there is no database, and no state is shared
# between replicas). A WebSocket client's whole session lives on whatever
# one pod it happened to connect to. Setting replicaCount > 1 does NOT give
# you a horizontally-scaled view of the same directory/presence/mailbox
# data — it gives you N independent, inconsistent copies, and a client
# load-balanced to a different pod than the one it published its bundle to
# will simply not find it. Scale replicas only if you have also solved that
# (e.g. consistent-hashing/sticky routing per identity fingerprint at the
# ingress/LB layer, which this chart does not set up for you), or if you
# accept running exactly one pod as the default, safe posture.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8787

# Config surfaced as environment variables via a ConfigMap
# (templates/configmap.yaml) — see server/README.md's Configuration table
# for what dratchetd itself understands.
config:
  # RUST_LOG-style filter for the tracing subscriber, e.g. "info" or
  # "dratchet_server=debug,info".
  logLevel: "info"
  # Comma-separated CIDR ranges of the reverse proxy in front of dratchetd
  # (DRA-0055). Leave empty unless `ingress.enabled: true`: with no proxy,
  # per-address connection limits use the TCP peer address, which can't be
  # spoofed. With the Ingress, set this to your ingress controller's pod
  # range (e.g. "10.42.0.0/16" on a default k3s/RKE2 cluster), or every
  # client is counted as the controller's single address. Never list a
  # range clients can connect from directly: X-Forwarded-For from a trusted
  # address is believed.
  trustedProxies: ""

# Queued-mail persistence (docs/adr/0001, server/README.md "Queued mail").
#
# dratchetd counts the container's memory limit as its usable memory, and
# turns persistence on by itself below 2 GB, which every pod under this
# chart's `resources` is. So the chart always sets it explicitly. With it
# on, each queued message is encrypted with the key below and split into
# Fragments across the `fragments` volumes; a sender's checkmark waits until
# its message is on disk, and a clean pod shutdown makes a final save so
# clients don't see a new server epoch (and a Retry prompt) on restart.
#
# Turning it off keeps queued mail in memory only: a restart loses it and
# clients offer to resend, and once unsaved mail fills `memoryLimit`, new
# writes are refused.
mailPersistence:
  enabled: true
  # Seconds between saves, 0-15 (0 saves on every write).
  flushInterval: 10
  # Bytes of unsaved mail held in memory. Empty: a tenth of the container's
  # memory limit. Half of it triggers an early save.
  memoryLimit: ""
  key:
    # An existing Secret holding the 64-hex-character key (e.g. from your
    # secrets manager). Takes precedence over `generate`.
    existingSecret: ""
    secretKey: key
    # Without an existing Secret, generate a random key into a Secret this
    # chart owns, reused on every upgrade. Set false to make an install
    # without `existingSecret` fail instead.
    generate: true
  # One volume per fragment directory: at least two, with different names.
  # Use different storage classes or backends where you can, so no single
  # volume holds a complete message.
  fragments:
    - name: a
      size: 1Gi
      storageClass: ""
    - name: b
      size: 1Gi
      storageClass: ""
  # The encrypted index of which Fragments make up which message.
  index:
    size: 256Mi
    storageClass: ""
  # emptyDir instead of PersistentVolumeClaims: queued mail survives a
  # container restart but not the pod being replaced. For test clusters
  # without a storage provisioner.
  ephemeral: false

resources:
  # A single WebSocket connection handler + a small in-memory HashMap-based
  # store is lightweight; these are conservative starting points, not a
  # measured production ceiling — the fitting Phase 1.1/1.2 stress test
  # (server/tests/stress.rs) is a reasonable starting point for load
  # testing your own limits before tuning these.
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness/readiness both point at the same /healthz endpoint
# (dratchet_server::app()'s healthz route) — it's a plain 200 OK with no
# dependency checks (there's nothing to check: no database, no external
# calls), so liveness and readiness are equivalent for this service.
probes:
  liveness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# A WebSocket connection is long-lived by design (server/README.md's
# "Deployment posture" section) — give in-flight connections real time to
# finish (or be told to reconnect elsewhere) instead of being cut off
# mid-frame when a pod is terminated. Must be >= the pod's own graceful
# shutdown budget; dratchetd handles SIGTERM via axum's graceful shutdown
# (server/src/main.rs).
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  # --- TLS / wss:// ---
  # dratchetd itself speaks plain `ws://` only — it has no built-in TLS
  # support, and isn't meant to (see server/README.md's "TLS / wss://"
  # section). TLS termination belongs at this Ingress, the standard place
  # for it in Kubernetes. Once the Ingress is serving HTTPS for a host, the
  # WebSocket upgrade on that same connection automatically becomes
  # `wss://` from the client's point of view — there is no separate "turn
  # on wss" switch beyond configuring TLS below. Traffic from the Ingress
  # to the pod stays plain `ws://` inside the cluster network, which is the
  # normal, expected pattern (that hop never crosses the internet).
  #
  # Leaving `tls: []` while `enabled: true` is valid but means the
  # endpoint(s) below are served as plain, unencrypted `ws://` externally —
  # the rendered NOTES.txt calls this out explicitly after `helm install`
  # so it's never a silent gap.
  #
  # Two ways to populate `tls:`:
  #
  # 1. cert-manager (recommended if your cluster has it installed) — point
  #    it at an issuer via annotation, and it creates/renews the Secret
  #    named below for you automatically:
  #
  #      annotations:
  #        cert-manager.io/cluster-issuer: letsencrypt-prod
  #      tls:
  #        - hosts: ["dratchet.example.com"]
  #          secretName: dratchet-tls
  #
  # 2. A TLS Secret you already have (manually issued, or from another
  #    process) — just reference it, no annotation needed:
  #
  #      kubectl create secret tls dratchet-tls --cert=fullchain.pem --key=privkey.pem
  #
  #      tls:
  #        - hosts: ["dratchet.example.com"]
  #          secretName: dratchet-tls
  #
  # Note this chart's scope: exposing a plain Service directly (NodePort or
  # a cloud LoadBalancer, `ingress.enabled: false`) has no TLS story of its
  # own — `wss://` in that case would need a TLS-terminating layer of your
  # own in front (a cloud LB with TLS termination, a sidecar proxy, etc.),
  # which this chart doesn't set up. The Ingress path above is the
  # supported way to get `wss://`.
  annotations: {}
  hosts:
    - host: dratchet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
