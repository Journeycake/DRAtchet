name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (sequoia-openpgp's openssl crypto backend)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p dratchet-core --all-targets -- -D warnings

      - name: Build
        run: cargo build -p dratchet-core --all-targets

      - name: Test
        run: cargo test -p dratchet-core

  fuzz-smoke:
    name: fuzz smoke test (decode_envelope, unpad_payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and fuzz build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('core/fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz decode_envelope (60s)
        working-directory: core
        run: cargo fuzz run decode_envelope -- -max_total_time=60

      - name: Fuzz unpad_payload (60s)
        working-directory: core
        run: cargo fuzz run unpad_payload -- -max_total_time=60
