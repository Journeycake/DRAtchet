[package]
name = "dratchet-store"
version = "0.1.0"
edition = "2021"
description = "DRAtchet local encrypted storage — accounts, contacts, ratchet sessions, and messages, persisted in a pure-Rust embedded database (no SQLCipher/OpenSSL dependency; docs/ARCHITECTURE.md §5)"
license = "GPL-3.0-only"

[dependencies]
dratchet-core = { path = "../core" }
redb = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
thiserror = "1"
zeroize = "1"
# QR code image generation for §6.3's in-person verification path — pure
# Rust (no native imaging library), rendered to a real PNG so it can
# actually be scanned, not just a placeholder image.
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# For tests/routing_id_exchange.rs's real spawned-server end-to-end test
# only — store/ itself has no transport dependency.
dratchet-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
# To prove a generated QR PNG is genuinely decodable, not just "an image
# got written" — the pure-Rust counterpart to the `qrcode` crate.
rqrr = "0.7"
