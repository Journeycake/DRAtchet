[package]
name = "dratchet-store"
version = "0.1.0"
edition = "2021"
description = "DRAtchet local encrypted storage — accounts, contacts, ratchet sessions, and messages, persisted in a pure-Rust embedded database (no SQLCipher/OpenSSL dependency; docs/ARCHITECTURE.md §5)"
license = "GPL-3.0-only"

[dependencies]
dratchet-core = { path = "../core" }
redb = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
