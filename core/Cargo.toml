[package]
name = "dratchet-core"
version = "0.1.0"
edition = "2021"
description = "DRAtchet v0 crypto core: X3DH handshake + Double Ratchet message layer, Ed25519/X25519 identity"
license = "GPL-3.0-only"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
# "zeroize": StaticSecret and its Diffie-Hellman output zeroize their bytes on drop
# instead of leaving key material sitting in freed memory.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1"
zeroize = "1"
# For RatchetState::export()/import() only (core/src/ratchet.rs) — an
# internal persistence format, not the wire envelope (MESSAGE_SCHEMA.md §2's
# "why a minimal custom wire format" rationale is specifically about that
# envelope; CBOR here matches what server/client already use for their own
# structured (de)serialization).
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
proptest = "1"
