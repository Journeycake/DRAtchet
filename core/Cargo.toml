[package]
name = "dratchet-core"
version = "0.1.0"
edition = "2021"
description = "DRAtchet v0 crypto core: X3DH handshake + Double Ratchet message layer, OpenPGP identity"
license = "GPL-3.0-only"

[dependencies]
sequoia-openpgp = { version = "1", default-features = false, features = ["crypto-openssl"] }
# "zeroize": StaticSecret and its Diffie-Hellman output zeroize their bytes on drop
# instead of leaving key material sitting in freed memory.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
proptest = "1"
